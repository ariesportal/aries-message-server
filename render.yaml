services:
  - type: web
    name: aries-message-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aries-message-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: aries-message-db
    plan: free
